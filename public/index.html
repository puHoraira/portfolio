<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131412" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Md. Abu Horaira, CSE undergraduate at the University of Dhaka. Full-stack developer and researcher working on edge AI for autonomous UAVs."
    />
    <meta property="og:title" content="Md. Abu Horaira · Portfolio" />
    <meta
      property="og:description"
      content="Full-stack systems, edge AI research and a published dataset for road-crossing detection."
    />
    <meta property="og:image" content="https://puhoraira.github.io/portfolio/pp1.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
    <!-- Apply saved or system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <title>Md. Abu Horaira · Portfolio</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to view this site.</noscript>
    <div id="root"></div>
  </body>
</html>
